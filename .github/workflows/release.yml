name: Build release

on:
  push:
    tags:
      - "v*"
  # Manual runs only build; the packages are attached to the run as artifacts.
  workflow_dispatch:

jobs:
  # jpackage can't cross-build, so each native package is built on its own OS.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Temurin, because jlink (used by jpackage) refuses JDKs with a modified security config.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install appimagetool
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          # Extract instead of mounting, since the runner has no FUSE.
          ./appimagetool.AppImage --appimage-extract > /dev/null
          echo "APPIMAGETOOL=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew clean distZip appImage
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            build/distributions/*.zip
            build/distributions/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install warp-packer
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          curl -fsSL -o warp-packer.exe https://github.com/kirbylink/warp/releases/download/v1.3.0/windows-x64.warp-packer.exe
          echo "483726e0eb10a43167c03c8e4f27a2901741affd245e5ec8ed45509f9dcd7a8a  warp-packer.exe" | sha256sum -c -
          echo "WARP_PACKER=$(cygpath -w "$PWD/warp-packer.exe")" >> "$GITHUB_ENV"
      - name: Build
        run: .\gradlew.bat clean portableZip windowsExe
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/distributions/*.zip
            build/distributions/*.exe

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
