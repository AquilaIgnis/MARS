name: Build release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java 
        uses: actions/setup-java@v5
        with:
          distribution: redhat
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew clean distZip
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip